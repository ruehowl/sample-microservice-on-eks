# GitHub Actions workflow for CI/CD
# TODO: Complete this pipeline

name: Build and Deploy

on:
  push:
    branches:
      - main
      - master
      - ip-restrict
    paths:
      - 'my-solution/app/**'
      - 'my-solution/kubernetes/**'
  pull_request:
    branches:
      - main
      - master
      - ip-restrict
    paths:
      - 'my-solution/app/**'
      - 'my-solution/kubernetes/**'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  PROJECT_NAME: document-service
  ECR_REPOSITORY: document-service
  EKS_CLUSTER_NAME: document-service-eks-cluster

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            my-solution/app/requirements.txt
      
      - name: Install dependencies
        run: |
          cd my-solution/app
          pip install -r requirements.txt
      
      - name: Run unit tests
        run: |
          set -euo pipefail
          cd my-solution/app
          pytest -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (cached)
        uses: docker/build-push-action@v5
        with:
          context: ./my-solution/app
          file: ./my-solution/app/Dockerfile
          load: true
          tags: ${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test - docker compose up
        run: |
          set -euo pipefail
          cd my-solution/app
          printf '\n=== docker compose up ===\n'
          APP_IMAGE="$ECR_REPOSITORY:latest" docker compose up -d
          docker compose ps

      - name: Smoke test - endpoints
        run: |
          set -euo pipefail
          cd my-solution/app

          printf '\n=== wait for liveness ===\n'
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health/live >/dev/null; then
              echo "live: ok"
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:8000/health/live

          printf '\n=== wait for readiness (200) ===\n'
          ready=0
          for i in $(seq 1 90); do
            code=$(curl -sS -o /tmp/health_ready.json -w "%{http_code}" http://localhost:8000/health/ready || true)
            if [ "$code" = "200" ]; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo "readiness never reached 200; last response:" >&2
            cat /tmp/health_ready.json >&2 || true
            exit 1
          fi
          cat /tmp/health_ready.json

          printf '\n=== document create/retrieve ===\n'
          doc_id="ci-smoke-$(date +%s)"
          content="hello-from-ci"
          curl -fsS -X PUT "http://localhost:8000/documents/${doc_id}" \
            -H 'Content-Type: application/json' \
            -d "{\"content\":\"${content}\"}" | tee /tmp/put_doc.json
          curl -fsS "http://localhost:8000/documents/${doc_id}" | tee /tmp/get_doc.json
          grep -q "\"id\":\"${doc_id}\"" /tmp/get_doc.json
          grep -q "\"content\":\"${content}\"" /tmp/get_doc.json

      - name: Smoke test - docker compose logs & down
        if: always()
        run: |
          set +e
          cd my-solution/app
          printf '\n=== docker compose logs (tail) ===\n'
          docker compose logs --no-color --tail 200 || true
          printf '\n=== docker compose down ===\n'
          docker compose down -v || true

      - name: Set up Helm (chart checks)
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Helm lint + manifest generation (dry run)
        run: |
          set -euo pipefail
          cd my-solution/kubernetes/helm/document-service
          helm lint .
          helm template document-service . > /tmp/document-service-rendered.yaml
          test -s /tmp/document-service-rendered.yaml
          echo "\n=== helm template (full manifest) ==="
          cat /tmp/document-service-rendered.yaml
      
      # TODO: Add security scanning
      # - name: Run Trivy vulnerability scanner
      #   uses: aquasecurity/trivy-action@master
      #   with:
      #     image-ref: $ECR_REPOSITORY:latest
      #     format: 'sarif'
      #     output: 'trivy-results.sarif'
      #     severity: 'CRITICAL,HIGH'

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd my-solution/app
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.29.0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Configure kubectl for EKS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"


      - name: Install/upgrade AWS Load Balancer Controller
        run: |
          set -euo pipefail
          helm repo add eks https://aws.github.io/eks-charts
          helm repo update

          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            --namespace kube-system \
            --create-namespace \
            -f my-solution/kubernetes/helm/values/aws-load-balancer-controller.yaml

          kubectl -n kube-system rollout status deployment/aws-load-balancer-controller --timeout=180s

      - name: Deploy to EKS (Helm)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          helm upgrade --install document-service my-solution/kubernetes/helm/document-service \
            -f my-solution/kubernetes/helm/values/document-service-dev.yaml \
            --namespace default \
            --create-namespace \
            --set image.repository="$ECR_REGISTRY/$ECR_REPOSITORY" \
            --set image.tag="$IMAGE_TAG"
      

      # TODO: Add integration tests
