$schema: http://json-schema.org/draft-07/schema#
title: Helm Component Type
description: Schema for Helm deployment components used by the sample EKS solution
type: object
properties:
  name:
    type: string
    description: Component name
  type:
    type: string
    const: helm
    description: Component type identifier
  inputs:
    type: object
    description: Helm-specific input values
    properties:
      chart:
        type: string
        description: Helm chart path or reference
      valuesFile:
        type: string
        description: Values file passed to Helm commands
      releaseName:
        type: string
        description: Helm release name
      namespace:
        type: string
        description: Kubernetes namespace
      timeout:
        type: string
        description: Helm operation timeout
    additionalProperties: true
