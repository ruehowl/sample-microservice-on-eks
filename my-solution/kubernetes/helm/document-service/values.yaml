# Minimal, renderable defaults for document-service

replicaCount: 1

image:
  repository: document-service
  pullPolicy: IfNotPresent
  tag: "latest"

serviceAccount:
  create: true
  annotations: {}
  name: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: false

autoscaling:
  enabled: false

podSecurityContext: {}

securityContext: {}

resources: {}

config:
  port: 8000
  awsRegion: "us-east-1"
  storageType: "s3"
  storageBucket: "document-service-storage"
  cacheHost: ""
  cachePort: 6379

probes:
  liveness:
    path: /health/live
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /health/ready
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
  startup:
    path: /health/live
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30

